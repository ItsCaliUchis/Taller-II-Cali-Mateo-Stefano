[project]
name = "calimateostefano-workplace"
version = "0.1.0"
description = "Espacio de trabajo para las consignas de taller del segundo cuatrimestre"
authors = [
    {name = "cali, mateo y stefano"}
]
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "nltk (>=3.10.3,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "gensim (>=4.4.0,<5.0.0)",
    "simple-elmo (>=0.9.2,<0.10.0)",
    "tf-keras (==2.21.0)",
    "transformers (>=5.20.1,<6.0.0)",
    "optuna (>=4.0.0,<5.0.0)",
]

[project.scripts]
extractor = "extract.extractor:main"
clean = "clean.cleanup:main"
explore = "clean.exploratorio:main"
bow = "preprocessing.bow_embedding:main"
list = "list_tools:main"
idfMonogram = "preprocessing.idf_ngram:monograma"
idfBigram = "preprocessing.idf_ngram:bigrama"
fasttext = "preprocessing.fasttext:main"
elmo = "preprocessing.elmo:main"
bert = "preprocessing.bert:main"
sgd = "training.sgd:main"
rna = "training.rna:main"
schedule = "schedule:main"
drive = "drive_downloader.cli:main"

[tool.poetry]
packages = [
    {include = "clean", from = "src"},
    {include = "config.py", from = "src"},
    {include = "drive_downloader", from = "src"},
    {include = "extract", from = "src"},
    {include = "list_tools.py", from = "src"},
    {include = "preprocessing", from = "src"},
    {include = "schedule.py", from = "src"},
    {include = "training", from = "src"},
    {include = "utils.py", from = "src"},
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
torch = [
    { version = "==2.15.0+cpu", source = "pytorch-cpu", markers = "extra != 'cuda'" },
    { version = "==2.15.0+cu132", source = "pytorch-cuda", markers = "extra == 'cuda'" },
]

[project.optional-dependencies]
cuda = []

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
priority = "explicit"

[dependency-groups]
dev = [
    "tomlkit (>=0.15.2,<0.16.0)"
]
