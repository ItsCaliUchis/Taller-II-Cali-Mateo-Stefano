[project]
name = "calimateostefano-workplace"
version = "0.1.0"
description = "Espacio de trabajo para las consignas de taller del segundo cuatrimestre"
authors = [
    {name = "cali, mateo y stefano"}
]
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "matplotlib (>=3.11.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
